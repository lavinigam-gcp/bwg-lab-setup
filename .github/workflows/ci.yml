name: ci
on: [push, pull_request]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax
        run: for f in setup/*.sh; do bash -n "$f"; done

      - name: shellcheck
        # No `|| true`. A lint step that cannot fail the build is decoration. All three
        # scripts are clean at -S warning today, so this holds the line where it is.
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck -S warning setup/*.sh

      - name: preflight runs and reports
        run: bash setup/preflight.sh || [ $? -le 2 ]

      - name: preflight is track-neutral
        run: |
          # --track must record the track and change nothing that is measured. If a
          # check ever becomes track-dependent, these counts stop matching.
          python3 - <<'PY'
          import json, subprocess, sys
          def run(args):
              p = subprocess.run(["bash", "setup/preflight.sh", "--json"] + args,
                                 capture_output=True, text=True)
              return json.loads(p.stdout)
          base = run([])
          for t in ("2", "3"):
              got = run(["--track", t])
              assert got["track"] == t, got["track"]
              for k in ("verdict", "exit", "ok", "warn", "fail"):
                  assert got[k] == base[k], (k, got[k], base[k])
              assert len(got["checks"]) == len(base["checks"])
          assert base["track"] == "not given"
          print("preflight is track-neutral:", base["verdict"], base["ok"], "ok")
          PY

      - name: install dry-run completes
        run: |
          bash setup/install.sh --dry-run --yes --root /tmp/ci > /tmp/dry.out 2>&1
          # Assert the terminal marker, not a step number. This used to grep "Step 6/6"
          # and broke the moment a step was removed, even though the dry-run succeeded.
          grep -q "Done. Now run" /tmp/dry.out \
            || { echo "dry-run did not reach the end"; cat /tmp/dry.out; exit 1; }

      - name: dry-run must not create anything
        run: test ! -d /tmp/ci

      - name: every declared step is runnable
        run: |
          steps=$(sed -n 's/^ALL_STEPS=(\(.*\))/\1/p' setup/install.sh)
          [ -n "$steps" ] || { echo "could not read ALL_STEPS"; exit 1; }
          for s in $steps; do
            grep -q "^step_$s()" setup/install.sh \
              || { echo "declared step '$s' has no step_$s function"; exit 1; }
            bash setup/install.sh --dry-run --yes --only "$s" --root /tmp/ci-only >/dev/null 2>&1 \
              || { echo "--only $s failed"; exit 1; }
          done
          for f in $(grep -oE '^step_[a-z]+' setup/install.sh | sed 's/step_//'); do
            echo "$steps" | grep -qw "$f" \
              || { echo "step_$f exists but is not in ALL_STEPS"; exit 1; }
          done
          echo "steps ok: $steps"

      - name: verify has not lost its checks
        run: |
          # ' *chk ', not '^chk ': the track-specific checks live inside an if block and
          # are indented. Counting only column-zero calls would silently ignore them.
          n=$(grep -cE '^ *chk ' setup/verify.sh)
          [ "$n" -ge 15 ] || { echo "verify.sh has only $n checks - did some get deleted?"; exit 1; }
          echo "verify.sh has $n checks"

      - name: both track profiles are present and Track 2 kept every check it had
        run: |
          for c in packages sessions lab-skill config-paths; do
            grep -qE "^ *chk $c " setup/verify.sh \
              || { echo "Track 2 check '$c' was deleted"; exit 1; }
          done
          for c in kit kit-skills kit-mcp kit-publish gh; do
            grep -qE "^ *chk $c " setup/verify.sh \
              || { echo "Track 3 check '$c' is missing"; exit 1; }
          done
          echo "both profiles present"

      - name: verify.sh actually runs, and the documented counts hold
        run: |
          # Grepping verify.sh for chk lines cannot tell you whether the script runs,
          # whether --track 3 is even accepted, or whether "11 of 11" and "12 of 12" are
          # real. Run it against a fixture and assert the totals the docs promise.
          mkdir -p /tmp/fx/bin && ln -sf "$(command -v python3)" /tmp/fx/bin/python
          mkdir -p /tmp/r2/Desktop/Session1/.agents/skills/novasmart-governance-lab
          mkdir -p /tmp/r2/Desktop/Session2/.agents/skills /tmp/r2/Desktop/Session3/.agents/skills
          touch /tmp/r2/Desktop/Session1/.agents/skills/novasmart-governance-lab/SKILL.md
          mkdir -p /tmp/kit/.agents/skills/publish-to-github
          git init -q /tmp/kit
          git -C /tmp/kit remote add origin https://github.com/cszhu/build-with-gemini
          git -C /tmp/kit -c user.email=ci@ci -c user.name=ci commit -q --allow-empty -m fixture
          touch /tmp/kit/.agents/mcp_config.json /tmp/kit/.agents/skills/publish-to-github/publish.sh
          t2=$(bash setup/verify.sh --json --track 2 --venv /tmp/fx --root /tmp/r2 \
               | python3 -c 'import json,sys;print(json.load(sys.stdin)["total"])')
          t3=$(bash setup/verify.sh --json --track 3 --venv /tmp/fx --kit-dir /tmp/kit \
               | python3 -c 'import json,sys;print(json.load(sys.stdin)["total"])')
          [ "$t2" = 11 ] || { echo "Track 2 runs $t2 checks, the docs promise 11"; exit 1; }
          [ "$t3" = 12 ] || { echo "Track 3 runs $t3 checks, the docs promise 12"; exit 1; }
          echo "verify runs: track2=$t2 track3=$t3"

      - name: verify.sh refuses an unknown flag instead of guessing
        run: |
          # A mistyped --trak used to fall through the case and run the Track 2 profile
          # on a Track 3 laptop, then recommend remedies that made that machine worse.
          if bash setup/verify.sh --trak 3 --venv /tmp/fx >/dev/null 2>&1; then
            echo "verify.sh silently accepted an unknown flag"; exit 1; fi
          bash setup/verify.sh --trak 3 --venv /tmp/fx 2>&1 | grep -q "unknown option" \
            || { echo "verify.sh rejected the flag without saying why"; exit 1; }
          if bash setup/verify.sh 3 --venv /tmp/fx >/dev/null 2>&1; then
            echo "verify.sh silently accepted a bare positional argument"; exit 1; fi
          bash setup/verify.sh --help >/dev/null || { echo "--help broke"; exit 1; }
          echo "unknown flags are refused, --help still works"

      - name: the readiness report does not ask for credentials nobody has yet
        run: |
          # This is the assertion that was missing. Nothing in this file has ever
          # depended on the readiness text, which is why the same defect shipped twice:
          # the first attempt edited verify.sh while the offending text came from the
          # skill, and the second moved the gate to a step number that runs inside the
          # install anyway. Both passed CI. These are outcome assertions on what an
          # attendee actually reads.
          #
          # Two things have to be faked to reach the pre-event and event-day states on a
          # runner: gcloud, and HOME. The shim answers only the two queries verify.sh
          # makes, so it cannot accidentally pass something real.
          mkdir -p /tmp/shim /tmp/h/.config/gcloud
          cat > /tmp/shim/gcloud <<'SH'
          #!/usr/bin/env bash
          case "$*" in
            "config get-value project") printf '%s\n' "${STUB_PROJECT:-}" ;;
            "config get-value account") printf '%s\n' "${STUB_ACCOUNT:-}" ;;
          esac
          SH
          chmod +x /tmp/shim/gcloud
          ADC=/tmp/h/.config/gcloud/application_default_credentials.json
          # $1 verdict, rest passed through. Prints the readiness output.
          rd() { pfv="$1"; shift
                 env HOME=/tmp/h PATH=/tmp/shim:$PATH bash setup/verify.sh --readiness \
                   --preflight-verdict "$pfv" --venv /tmp/fx --root /tmp/r2 "$@" 2>&1; }
          has() { grep -qF "$2" <<<"$1" || { echo "MISSING: $2"; echo "$1"; exit 1; }; }
          hasnt() { grep -qF "$2" <<<"$1" && { echo "SHOULD NOT APPEAR: $2"; echo "$1"; exit 1; }; return 0; }

          # ---- pre-event, in all three of its shapes ----
          # The phase is keyed on the lab project and nothing else. These three states
          # are all before the event, and the middle two are what most of a room of
          # professional developers actually looks like a week out: they have used
          # Google Cloud before, so they have a project and a credentials file already.
          # Keying the phase on that file put all of them on the day-of branch.
          for state in "bare::" "personal-adc::lavinigam@example.com" "personal-project:my-own-project:lavinigam@example.com"; do
            IFS=: read -r label proj acct <<<"$state"
            rm -f "$ADC"
            [ "$label" = bare ] || echo '{}' > "$ADC"
            export STUB_PROJECT="$proj" STUB_ACCOUNT="$acct"
            for v in go caveats unknown; do
              out="$(rd $v || true)"
              has "$out" "Next steps, on the day of the event"
              has "$out" "Your gcloud authentication credentials are given to you at the event."
              # The whole defect in one assertion. Before the event there is nothing to
              # sign in with, so no sign-in command may appear at all. Not as a bullet,
              # not indented under a "you will run these later" label: a command on the
              # screen is read as a thing to type, and the label is not.
              hasnt "$out" "gcloud auth login"
              hasnt "$out" "application-default"
              hasnt "$out" "gh auth login"
              # And nothing in the actionable list may be a cloud task at all.
              todo="$(sed -n '/Still to do:/,/^$/p' <<<"$out")"
              case "$todo" in *gcloud*|*Qwiklabs*)
                echo "the pre-event 'Still to do' list contains a cloud task:"; echo "$todo"; exit 1 ;;
              esac
            done
            # The footer must stay true for a laptop that already has the attendee's own
            # project and credentials on it. Telling them "project: none" when they have
            # one is how the old wording lost their trust in the rest of the report.
            out="$(rd unknown || true)"
            case "$label" in
              personal-project) has "$out" "my-own-project (your own, not a lab project" ;;
              personal-adc)     has "$out" "adc        : present (your own, not a lab credential)" ;;
            esac
            echo "pre-event ok: $label"
          done
          echo "pre-event: no sign-in command is printed in any of the three states"

          # ---- event day: a project has been issued, sign-in not finished ----
          # A project and no credentials is the real event-day state. Setting both would
          # make auth "signed in" and skip the block this is trying to assert on.
          rm -f "$ADC"; export STUB_PROJECT="qwiklabs-gcp-01-abc123" STUB_ACCOUNT="student-01@qwiklabs.net"
          for v in go caveats unknown; do
            out="$(rd $v || true)"
            has "$out" "Next steps, now that your lab credentials have been issued"
            has "$out" "gcloud auth login && gcloud auth application-default login"
            # This block used to repeat "your credentials are given to you at the
            # event" three lines under a heading saying they had already been issued.
            # The sentence is right in the pre-event and NO-GO blocks and wrong here,
            # so here it names where to read the value instead of when it arrives.
            has "$out" "PROJECT_ID is on the lab credentials card you were given."
            hasnt "$out" "Your gcloud authentication credentials are given to you at the event."
            hasnt "$out" "Next steps, on the day of the event"
          done
          echo "event day: the real commands are printed, and nothing says the credentials are still coming"

          # ---- day of the event, fully signed in ----
          # Nothing is outstanding, so no commands. It must still SAY so: the report
          # used to stop dead after the table here, and an attendee who reads nothing
          # after it cannot tell "all good" apart from "the script gave up".
          #
          # "You are ready." is a verdict on the WHOLE card and is gated on the whole
          # card passing. This fixture's venv is a bare python symlink, so the software
          # rows are failing, and the card here also says "software toolchain not ready"
          # and "Still to do: fix the failing checks above". It used to print
          # "You are ready." underneath all of that, because the line was derived from
          # the sign-in alone. The narrow claim, about Google Cloud only, is still made.
          echo '{}' > "$ADC"
          out="$(rd go || true)"
          has "$out" "Signed in to the lab project. Nothing left to do for Google Cloud."
          has "$out" "Fix the failing checks above and run this again."
          hasnt "$out" "You are ready."
          hasnt "$out" "Next steps"
          hasnt "$out" "gcloud auth login"
          echo "signed in with failing software rows: the narrow line is printed, the verdict is not"
          # Positive control, by code reading rather than by fixture. The whole-card
          # verdict must still be reachable: the fix gates the line, it does not
          # delete it. A fixture that actually reaches it needs a real 3.14 venv with
          # 120 pinned packages, node 24 and gcloud, which this job does not build,
          # so that arm is exercised on a real machine and not here.
          grep -qF 'echo "  Signed in to the lab project. You are ready."' setup/verify.sh \
            || { echo "the positive verdict line was deleted rather than gated"; exit 1; }
          grep -qF '[ "$sw" = ready ] && [ "$est" = installed ] && [ "$code" = 0 ]' setup/verify.sh \
            || { echo "the positive verdict line is not gated on the card passing"; exit 1; }

          # ---- NO-GO: no sign-in content in either phase ----
          for phase in pre event; do
            rm -f "$ADC"
            if [ "$phase" = pre ]; then export STUB_PROJECT=""
            else export STUB_PROJECT="qwiklabs-gcp-01-abc123"; fi
            out="$(rd no-go || true)"
            has "$out" "use the provided lab VM instead"
            has "$out" "ask for a loaner laptop at the event"
            # No commands on NO-GO, but still say where credentials come from, so
            # the attendee is not left wondering why they have none.
            has "$out" "credentials are given to you at the event"
            for s in "gcloud auth login" "application-default" "Qwiklabs" "Next steps"; do
              hasnt "$out" "$s"
            done
          done
          echo "no-go: VM or loaner only, no sign-in content"

          # ---- "you are not signed in" must not be said to someone who is ----
          # verify.sh used to key the pre-event state on the project alone, so a machine
          # with application-default credentials and no project was told it was not
          # signed in. Half of that sentence was false.
          rm -f "$ADC"; echo '{}' > "$ADC"; export STUB_PROJECT=""
          out="$(rd unknown || true)"
          hasnt "$out" "You are not signed in and no lab"
          echo "adc present: the pre-event sentence is not printed"

          # ---- the verdict changes text and nothing else ----
          # --preflight-verdict must not touch the exit-code contract. CI, the skill and
          # the repair table all read those codes.
          rm -f "$ADC"; export STUB_PROJECT=""
          base=0; rd unknown >/dev/null 2>&1 || base=$?
          for v in go caveats no-go; do
            c=0; rd $v >/dev/null 2>&1 || c=$?
            [ "$c" = "$base" ] || { echo "--preflight-verdict $v changed the exit code: $c vs $base"; exit 1; }
          done
          echo "the verdict changes text only, exit stays $base"

          # ---- it is a real parser arm, not a fall-through ----
          # ci.yml already asserts that every flag the docs mention exists, but that
          # reads the parser as text. This runs it: a flag that falls through to the
          # catch-all arm exits 64, and the README now documents this one.
          c=0
          env HOME=/tmp/h PATH=/tmp/shim:$PATH bash setup/verify.sh --preflight-verdict go \
            --venv /tmp/fx --root /tmp/r2 >/dev/null 2>&1 || c=$?
          [ "$c" != 64 ] || { echo "--preflight-verdict is not in the parser"; exit 1; }
          if env HOME=/tmp/h bash setup/verify.sh --preflight-verdict nogo --venv /tmp/fx >/dev/null 2>&1; then
            echo "verify.sh accepted a mistyped verdict"; exit 1; fi
          echo "--preflight-verdict is parsed and validated"

      - name: the saved preflight verdict reaches verify.sh with no flag
        run: |
          # The NO-GO rule used to be reachable only by passing --preflight-verdict,
          # and nothing printed that flag: the README and the landing page both say to
          # run `verify.sh --readiness` bare. So the rule held when the assistant drove
          # the check and silently did not hold for a human following the written
          # instructions, which is the fallback for exactly the attendee whose machine
          # is in trouble. preflight now writes the word down and verify.sh reads it.
          has() { grep -qF "$2" <<<"$1" || { echo "MISSING: $2"; echo "$1"; exit 1; }; }
          hasnt() { grep -qF "$2" <<<"$1" && { echo "SHOULD NOT APPEAR: $2"; echo "$1"; exit 1; }; return 0; }
          mkdir -p /tmp/hv/novasmart-lab
          V=/tmp/hv/novasmart-lab/preflight-verdict
          rdv() { env HOME=/tmp/hv PATH=/tmp/shim:$PATH bash setup/verify.sh --readiness \
                    --venv /tmp/fx --root /tmp/r2 "$@" 2>&1; }

          # No file at all behaves as unknown, which is what it did before the file existed.
          rm -f "$V"
          out="$(rdv || true)"
          has "$out" "unknown (preflight has not recorded a verdict yet)"
          hasnt "$out" "use the provided lab VM instead"

          # A saved NO-GO, and NO flag. This is the assertion that was missing.
          printf 'verdict=no-go\nexit=2\nrecorded=2026-09-29T00:00:00Z\ntrack=2\n' > "$V"
          out="$(rdv || true)"
          has "$out" "use the provided lab VM instead"
          has "$out" "ask for a loaner laptop at the event"
          has "$out" "credentials are given to you at the event"
          # Where the verdict came from, so a stale one is visible rather than silent.
          has "$out" "no-go (recorded 2026-09-29T00:00:00Z for track 2)"
          for s in "gcloud auth login" "application-default" "Qwiklabs" "Next steps"; do
            hasnt "$out" "$s"
          done

          # An explicit flag still wins over the saved word.
          out="$(rdv --preflight-verdict go || true)"
          has "$out" "go (given with --preflight-verdict)"
          hasnt "$out" "use the provided lab VM instead"

          # A damaged file is nobody telling us, which is unknown, not a crash.
          printf 'verdict=garbage\n' > "$V"
          out="$(rdv || true)"
          has "$out" "could not be read, so treating it as unknown"

          # And preflight really does write it, with the track it was given.
          rm -f "$V"
          env HOME=/tmp/hv bash setup/preflight.sh --track 3 >/dev/null 2>&1 || [ $? -le 2 ]
          test -f "$V" || { echo "preflight did not record its verdict"; exit 1; }
          grep -qE '^verdict=(go|caveats|no-go)$' "$V" || { echo "bad verdict record:"; cat "$V"; exit 1; }
          grep -qx 'track=3' "$V" || { echo "the track was not recorded:"; cat "$V"; exit 1; }
          echo "the saved verdict is written, read, overridable and fail-safe"

      - name: the phase override is honoured and validated
        run: |
          # BWG_PHASE exists for the cases a project-id prefix cannot see: a rehearsal
          # on a project that is not a Qwiklabs one, or a support helper who needs to
          # read the other phase's wording. A wrong value is refused, not guessed at.
          has() { grep -qF "$2" <<<"$1" || { echo "MISSING: $2"; echo "$1"; exit 1; }; }
          hasnt() { grep -qF "$2" <<<"$1" && { echo "SHOULD NOT APPEAR: $2"; echo "$1"; exit 1; }; return 0; }
          ov() { env HOME=/tmp/h PATH=/tmp/shim:$PATH BWG_PHASE="$1" \
                   bash setup/verify.sh --readiness --venv /tmp/fx --root /tmp/r2 2>&1; }
          rm -f /tmp/h/.config/gcloud/application_default_credentials.json
          export STUB_PROJECT="qwiklabs-gcp-01-abc123" STUB_ACCOUNT="student-01@qwiklabs.net"
          out="$(ov pre-event || true)"
          has "$out" "Next steps, on the day of the event"
          hasnt "$out" "gcloud auth login"
          export STUB_PROJECT="" STUB_ACCOUNT=""
          out="$(ov day-of || true)"
          has "$out" "Next steps, now that your lab credentials have been issued"
          for s in verify preflight; do
            c=0
            env HOME=/tmp/h PATH=/tmp/shim:$PATH BWG_PHASE=sometime \
              bash "setup/$s.sh" >/dev/null 2>&1 || c=$?
            [ "$c" = 64 ] || { echo "$s.sh took a bad BWG_PHASE (exit $c, wanted 64)"; exit 1; }
          done
          echo "the phase override works both ways and a bad value exits 64"

      - name: preflight refuses an unknown flag instead of ignoring it
        run: |
          # verify.sh grew this arm and preflight.sh did not, so `preflight.sh --jsno`
          # exited 0 and printed a human report card to a caller that had asked for
          # JSON and would go on to misparse it.
          if bash setup/preflight.sh --jsno >/dev/null 2>&1; then
            echo "preflight.sh silently accepted an unknown flag"; exit 1; fi
          c=0; bash setup/preflight.sh --jsno >/dev/null 2>&1 || c=$?
          [ "$c" = 64 ] || { echo "preflight.sh exited $c on a bad flag, wanted 64"; exit 1; }
          bash setup/preflight.sh --jsno 2>&1 | grep -q "unknown option" \
            || { echo "preflight.sh rejected the flag without saying why"; exit 1; }
          bash setup/preflight.sh --help >/dev/null || { echo "--help broke"; exit 1; }
          echo "preflight refuses unknown flags with 64, and --help still works"

      - name: BWG_PHASE is honoured with no gcloud on the machine
        run: |
          # preflight set PHASE=pre-event and only reassigned it from lab_phase inside
          # `if command -v gcloud`, while verify.sh called lab_phase unconditionally.
          # So on a laptop with no gcloud at all, BWG_PHASE=day-of moved verify.sh to
          # the day-of branch and left preflight reporting "phase":"pre-event". Two
          # scripts disagreeing about one laptop is the exact failure lab-phase.sh was
          # written to make impossible.
          # A PATH with every ordinary tool on it and no gcloud. Prepending an empty
          # directory is NOT enough: `command -v gcloud` walks past it to whatever
          # the image already has, and some images do ship the Cloud SDK. Build the
          # PATH out of symlinks and then assert it really is gcloud-free, so this
          # test cannot quietly stop testing anything.
          nogc=/tmp/nogcloud; rm -rf "$nogc"; mkdir -p "$nogc"
          for d in /usr/bin /bin /usr/local/bin /usr/sbin; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              b="${f##*/}"
              case "$b" in gcloud|gsutil|bq) continue ;; esac
              [ -e "$nogc/$b" ] || ln -s "$f" "$nogc/$b" 2>/dev/null || true
            done
          done
          PATH="$nogc" command -v gcloud >/dev/null 2>&1 \
            && { echo "fixture broken: gcloud is still reachable"; exit 1; }
          for p in day-of pre-event; do
            got="$(PATH="$nogc" BWG_PHASE="$p" bash setup/preflight.sh --json 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["phase"])')"
            [ "$got" = "$p" ] \
              || { echo "no gcloud, BWG_PHASE=$p: preflight reported $got"; exit 1; }
            # verify.sh must agree. It reports the phase through its wording, so key
            # on the block each phase prints.
            out="$(PATH="$nogc" BWG_PHASE="$p" HOME=/tmp/h \
                   bash setup/verify.sh --readiness --venv /tmp/fx --root /tmp/r2 2>&1 || true)"
            if [ "$p" = day-of ]; then
              grep -qF "Next steps, now that your lab credentials have been issued" <<<"$out" \
                || { echo "no gcloud, BWG_PHASE=day-of: verify.sh did not take the day-of branch"; exit 1; }
            else
              grep -qF "Next steps, on the day of the event" <<<"$out" \
                || { echo "no gcloud, BWG_PHASE=pre-event: verify.sh did not take the pre-event branch"; exit 1; }
            fi
          done
          # A bad value is still refused, and still from the shared helper, with or
          # without gcloud present.
          c=0
          PATH="$nogc" BWG_PHASE=tomorrow bash setup/preflight.sh --json >/dev/null 2>&1 || c=$?
          [ "$c" = 64 ] || { echo "bad BWG_PHASE with no gcloud exited $c, wanted 64"; exit 1; }
          rm -rf "$nogc"
          echo "preflight and verify agree on the phase with no gcloud installed"

      - name: preflight --json survives a quote and a backslash in a field
        run: |
          # preflight emitted every field with a bare printf '%s' and no escaping,
          # while verify.sh escaped its one path field and explained why. Three of
          # preflight's fields carry strings this repo does not control: the TLS
          # issuer read out of curl -v, NAME= from /etc/os-release, and the gcloud
          # account. One double quote or one backslash in any of them produced
          # output that json.loads rejects, which is a confusing CI break and a
          # skill that cannot read a report card from the one corporate-proxied
          # laptop that most needs reading. Latent, not live, so it needs a fixture.
          #
          # The account is the field a test can control, through a stub gcloud that
          # is first on PATH. Installs nothing and touches no real configuration.
          rm -rf /tmp/jbin; mkdir -p /tmp/jbin
          cat > /tmp/jbin/gcloud <<'STUB'
          #!/usr/bin/env bash
          case "$*" in
            "config get-value account") printf '%s\n' 'stu"dent\01@ex ample.net' ;;
            "config get-value project") printf '%s\n' 'qwiklabs-gcp-01-a70b04a29bf7' ;;
            *) exit 1 ;;
          esac
          STUB
          chmod +x /tmp/jbin/gcloud
          out="$(PATH=/tmp/jbin:$PATH bash setup/preflight.sh --json 2>/dev/null || true)"
          # The raw bytes must carry the escapes, ...
          printf '%s' "$out" | grep -qF 'stu\"dent\\01@ex ample.net' \
            || { echo "the account field was not escaped"; printf '%s\n' "$out"; exit 1; }
          # ... the document must parse, ...
          printf '%s' "$out" | python3 -m json.tool > /dev/null \
            || { echo "preflight --json is not valid JSON"; printf '%s\n' "$out"; exit 1; }
          # ... and the value must survive the round trip unchanged.
          printf '%s' "$out" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          got = [c["found"] for c in d["checks"] if c["check"] == "google account"]
          want = "stu\"dent\\01@ex ample.net"
          assert got == [want], (got, want)
          print("round trip clean:", got[0])
          '
          rm -rf /tmp/jbin
          echo "preflight --json escapes untrusted fields"

      - name: a real install with no terminal stops and says so
        run: |
          # ------------------------------------------------------------------
          # THIS STEP STARTS A NON-DRY INSTALL. Do not replay it on a laptop.
          # It is the only step in this file that runs install.sh without
          # --dry-run, so if the consent stop ever regresses this is the one
          # test whose failure mode is "it installed a toolchain" rather than
          # "it printed the wrong thing". Someone copying this block into a
          # terminal to debug CI is exactly how a real machine got changed
          # once already. It refuses to run anywhere except a CI runner.
          # To check the same behaviour on a workstation, read the [ ! -t 0 ]
          # arms of gate() and wsl_gate() in setup/install.sh, and run
          # install.sh --dry-run, which never reaches either of them.
          # ------------------------------------------------------------------
          if [ "${GITHUB_ACTIONS:-}" != "true" ] && [ "${CI:-}" != "true" ]; then
            echo "REFUSING TO RUN. This step starts a real, non-dry install.sh."
            echo "It runs only on a CI runner, where the machine is disposable."
            echo "Neither GITHUB_ACTIONS nor CI is set to true here, so this looks"
            echo "like a laptop. Nothing was run and nothing was changed."
            echo "Use: bash setup/install.sh --dry-run"
            exit 1
          fi
          # No TTY and no --yes used to fall into the consent `read`, hit end of file,
          # trip the ERR trap and exit with nothing on screen. Someone running
          # `curl ... | bash` saw a bare failure and no reason for it.
          # Run it against a scratch HOME, never the real one. A scratch HOME bounds
          # a regression to a directory we can throw away.
          rm -rf /tmp/nottyhome /tmp/notty
          mkdir -p /tmp/nottyhome
          c=0
          env HOME=/tmp/nottyhome LAB_HOME=/tmp/nottyhome/novasmart-lab \
            bash setup/install.sh --skip-preflight --root /tmp/notty \
            > /tmp/notty.out 2>&1 < /dev/null || c=$?
          [ "$c" = 66 ] || { echo "no-TTY install exited $c, wanted 66"; cat /tmp/notty.out; exit 1; }
          grep -q "Stopped. Nothing was changed." /tmp/notty.out \
            || { echo "it stopped without saying so"; cat /tmp/notty.out; exit 1; }
          # It must stop BEFORE doing any work.
          test ! -d /tmp/notty || { echo "it changed something before stopping"; exit 1; }
          test ! -d /tmp/nottyhome/novasmart-lab/.venv || { echo "it built a venv before stopping"; exit 1; }
          echo "no-TTY install stops with exit 66 and changes nothing"

          # --skip-preflight must skip PREFLIGHT, not consent. It used to return out of
          # the whole gate, so this exact command installed without asking anyone.
          grep -q "preflight skipped" /tmp/notty.out \
            || { echo "--skip-preflight did not take effect"; cat /tmp/notty.out; exit 1; }
          grep -q "is about to set up Track" /tmp/notty.out \
            || { echo "--skip-preflight also skipped the consent screen"; cat /tmp/notty.out; exit 1; }
          echo "--skip-preflight skips preflight and still asks for consent"

          # --only must not skip consent either. It used to: main() called
          # `[ -z "$ONLY" ] && gate`, so `install.sh --only python` created
          # $LAB_HOME, built a venv and installed 120 packages without ever
          # disclosing it or asking. --only is the command every --fix-hints row
          # and every row of the skill's repair table tells people to run, so it
          # was the least-guarded path and the most-used one. Same assertion as
          # above, one step at a time, for every step in the registry.
          for s in tools python skills sessions register starterkit; do
            rm -rf /tmp/nottyhome /tmp/notty
            mkdir -p /tmp/nottyhome
            c=0
            env HOME=/tmp/nottyhome LAB_HOME=/tmp/nottyhome/novasmart-lab \
              bash setup/install.sh --only "$s" --root /tmp/notty \
              > /tmp/notty-only.out 2>&1 < /dev/null || c=$?
            [ "$c" = 66 ] \
              || { echo "--only $s exited $c with no terminal, wanted 66"; cat /tmp/notty-only.out; exit 1; }
            grep -q "Stopped. Nothing was changed." /tmp/notty-only.out \
              || { echo "--only $s stopped without saying so"; cat /tmp/notty-only.out; exit 1; }
            grep -q "is about to run one step on this machine: $s" /tmp/notty-only.out \
              || { echo "--only $s did not disclose what it would change"; cat /tmp/notty-only.out; exit 1; }
            grep -q "is about to set up Track" /tmp/notty-only.out \
              && { echo "--only $s disclosed the whole track, not the one step"; cat /tmp/notty-only.out; exit 1; }
            test ! -d /tmp/notty \
              || { echo "--only $s changed something before stopping"; exit 1; }
            test ! -d /tmp/nottyhome/novasmart-lab/.venv \
              || { echo "--only $s built a venv before stopping"; exit 1; }
          done
          echo "--only stops with exit 66 for every step and changes nothing"

          # The combinations. None of these is a way round the consent gate:
          # --yes is the ONLY thing that answers it, and it answers it rather
          # than skipping it, because the disclosure is printed either way.
          for args in "--only python --skip-preflight" "--skip-preflight --only tools" \
                      "--only python --force" "--only starterkit" "--track 3 --only tools"; do
            rm -rf /tmp/nottyhome /tmp/notty
            mkdir -p /tmp/nottyhome
            c=0
            # shellcheck disable=SC2086
            env HOME=/tmp/nottyhome LAB_HOME=/tmp/nottyhome/novasmart-lab BWG_TRACK=3 \
              bash setup/install.sh $args --root /tmp/notty \
              > /tmp/notty-combo.out 2>&1 < /dev/null || c=$?
            [ "$c" = 66 ] \
              || { echo "install.sh $args exited $c with no terminal, wanted 66"; cat /tmp/notty-combo.out; exit 1; }
            grep -q "Stopped. Nothing was changed." /tmp/notty-combo.out \
              || { echo "install.sh $args stopped without saying so"; cat /tmp/notty-combo.out; exit 1; }
            test ! -d /tmp/notty || { echo "install.sh $args changed something"; exit 1; }
          done
          echo "--only, --skip-preflight, --track and BWG_TRACK cannot skip consent"

          # A bad --only value is still refused with 64 before any consent screen,
          # so the gate did not turn a typo into a question.
          rm -rf /tmp/nottyhome; mkdir -p /tmp/nottyhome
          c=0
          env HOME=/tmp/nottyhome LAB_HOME=/tmp/nottyhome/novasmart-lab \
            bash setup/install.sh --only nosuchstep --root /tmp/notty \
            > /tmp/notty-bad.out 2>&1 < /dev/null || c=$?
          [ "$c" = 64 ] || { echo "--only nosuchstep exited $c, wanted 64"; cat /tmp/notty-bad.out; exit 1; }
          grep -q "is about to" /tmp/notty-bad.out \
            && { echo "it asked for consent to run a step that does not exist"; exit 1; }
          echo "a bad --only step is still 64, with no consent screen"
          rm -rf /tmp/nottyhome /tmp/notty

      - name: the WSL2 notice is a gate and not a warning
        run: |
          # ------------------------------------------------------------------
          # THIS STEP STARTS NON-DRY INSTALLS. Do not replay it on a laptop.
          # Same reasoning and the same refusal as the step above. Every run
          # below either stops at a gate or runs only `--only skills` with no
          # skills source, which is a no-op branch that writes nothing.
          # ------------------------------------------------------------------
          if [ "${GITHUB_ACTIONS:-}" != "true" ] && [ "${CI:-}" != "true" ]; then
            echo "REFUSING TO RUN. This step starts real, non-dry install.sh runs."
            echo "It runs only on a CI runner, where the machine is disposable."
            echo "Nothing was run and nothing was changed."
            exit 1
          fi
          # A GitHub runner is not WSL2 and /proc/version cannot be faked on it, so
          # the platform branch is patched in a COPY and the copy is what runs. That
          # is the only edit: wsl_gate itself, the consent gate and main() are the
          # real code. The copy lives outside the repo, so $LAB_SKILLS_SRC resolves
          # empty and `--only skills` is a branch that returns 0 having written
          # nothing, which is what makes the "it continued" cases safe to assert on.
          rm -rf /tmp/wslfx /tmp/wh; mkdir -p /tmp/wslfx/setup
          # Copy the whole setup/ folder, not just install.sh: a full dry run reaches the
          # Python step, which needs requirements-lock.txt next to the script.
          cp setup/requirements-lock.txt setup/lab-phase.sh /tmp/wslfx/setup/
          sed 's#grep -qi microsoft /proc/version 2>/dev/null && OS=wsl2#OS=wsl2#' \
            setup/install.sh > /tmp/wslfx/setup/install.sh
          grep -q '^          OS=wsl2 ;;$' /tmp/wslfx/setup/install.sh \
            || { echo "the WSL2 fixture did not patch the platform branch"; exit 1; }
          bash -n /tmp/wslfx/setup/install.sh || { echo "the WSL2 fixture does not parse"; exit 1; }
          wsl() { # answer-or-empty  extra-args...
            local ans="$1"; shift
            rm -rf /tmp/wh; mkdir -p /tmp/wh
            WSLC=0
            if [ -z "$ans" ]; then
              env HOME=/tmp/wh LAB_HOME=/tmp/wh/novasmart-lab \
                bash /tmp/wslfx/setup/install.sh --track 2 --only skills --root /tmp/wh/root \
                "$@" > /tmp/wsl.out 2>&1 < /dev/null || WSLC=$?
            else
              # `script` gives the child a real pty, so [ -t 0 ] is true, and feeds
              # it the answer. This is the only way to exercise the prompt in CI.
              printf '%s\n' "$ans" | script -qec \
                "env HOME=/tmp/wh LAB_HOME=/tmp/wh/novasmart-lab bash /tmp/wslfx/setup/install.sh --track 2 --only skills --root /tmp/wh/root $*" \
                /dev/null > /tmp/wsl.raw 2>&1 || WSLC=$?
              tr -d '\r' < /tmp/wsl.raw > /tmp/wsl.out
            fi
          }
          w_has()  { grep -qF -- "$1" /tmp/wsl.out || { echo "MISSING: $1"; cat /tmp/wsl.out; exit 1; }; }
          w_hasnt(){ grep -qF -- "$1" /tmp/wsl.out && { echo "SHOULD NOT APPEAR: $1"; cat /tmp/wsl.out; exit 1; }; return 0; }

          # 1. No terminal and no --yes: STOP. This used to warn and carry straight
          #    on, which made the limited-support notice advisory. On an --only run,
          #    where the consent gate was never reached either, that meant a real
          #    repair on an unsupported platform with nothing having asked anything.
          wsl ""
          [ "$WSLC" = 66 ] || { echo "WSL2 no-TTY exited $WSLC, wanted 66"; cat /tmp/wsl.out; exit 1; }
          w_has "Stopped. Nothing was changed."
          w_has "no terminal here to ask you for consent on"
          test ! -d /tmp/wh/novasmart-lab || { echo "it changed something before stopping"; exit 1; }

          # 2. No terminal, --yes: continue, with the warning on the record.
          wsl "" --yes
          [ "$WSLC" = 0 ] || { echo "WSL2 no-TTY --yes exited $WSLC, wanted 0"; cat /tmp/wsl.out; exit 1; }
          w_has "--yes given, continuing"
          w_hasnt "Stopped. Nothing was changed."

          # 3. A terminal, and --yes: the disclosure is STILL shown and STILL asked.
          #    --yes means "I accept the changes you listed", which is not the same
          #    statement as "I accept that this platform is only partly supported".
          wsl n --yes
          w_has "Windows with WSL2 is limited support"
          w_has "Continue on WSL2 anyway?"
          w_has "Stopped. Nothing was changed."
          w_hasnt "is about to run one step"
          test ! -d /tmp/wh/novasmart-lab || { echo "it changed something after n"; exit 1; }

          # 4. A terminal, --yes, answered y: through the WSL2 gate, and the consent
          #    gate below it still discloses before --yes answers it.
          wsl y --yes
          [ "$WSLC" = 0 ] || { echo "WSL2 TTY y exited $WSLC, wanted 0"; cat /tmp/wsl.out; exit 1; }
          w_has "Continue on WSL2 anyway?"
          w_has "is about to run one step on this machine: skills"
          w_has "--yes given, proceeding without asking"

          # 5. A dry run never blocks, on WSL2 or anywhere else.
          rm -rf /tmp/wh; mkdir -p /tmp/wh
          c=0
          env HOME=/tmp/wh bash /tmp/wslfx/setup/install.sh --track 2 --dry-run \
            > /tmp/wsl.out 2>&1 < /dev/null || c=$?
          [ "$c" = 0 ] || { echo "WSL2 dry run exited $c, wanted 0"; cat /tmp/wsl.out; exit 1; }
          w_has "DRY RUN - nothing will be changed"
          w_hasnt "Stopped. Nothing was changed."
          echo "WSL2: no-TTY stops with 66, --yes continues, a terminal is always asked, dry runs never block"
          rm -rf /tmp/wslfx /tmp/wh

      - name: preflight does not demand a lab account before the event
        run: |
          # The account row fired for every attendee pre-event and its advice asked for
          # credentials that did not exist. install.sh re-runs preflight inside its own
          # gate, so that advice also reached the user mid-install. Assert both halves:
          # the row is no longer a warning pre-event, and the advice string is gone.
          mkdir -p /tmp/shim2 /tmp/h2
          cat > /tmp/shim2/gcloud <<'SH'
          #!/usr/bin/env bash
          case "$*" in
            "config get-value project") printf '%s\n' "${STUB_PROJECT:-}" ;;
            "config get-value account") printf '%s\n' "${STUB_ACCOUNT:-}" ;;
          esac
          SH
          chmod +x /tmp/shim2/gcloud
          # || true: preflight exits 1 for GO WITH CAVEATS, which is the normal result on
          # a runner, and a bare command substitution of that would fail the step.
          pf() { env HOME=/tmp/h2 PATH=/tmp/shim2:$PATH bash setup/preflight.sh --json 2>/dev/null || true; }
          row() { python3 -c 'import json,sys;print([c["'"$2"'"] for c in json.load(sys.stdin)["checks"] if c["check"]=="google account"][0])' <<<"$1"; }
          export STUB_PROJECT="" STUB_ACCOUNT="someone@example.com"
          out="$(pf)"
          [ "$(row "$out" status)" = OK ] \
            || { echo "pre-event: google account is still a warning"; exit 1; }
          [ -z "$(row "$out" advice)" ] \
            || { echo "pre-event: google account still gives advice: $(row "$out" advice)"; exit 1; }
          export STUB_PROJECT="qwiklabs-gcp-01-abc123"
          out="$(pf)"
          [ "$(row "$out" status)" = WARN ] \
            || { echo "event day: a non-lab account is no longer flagged"; exit 1; }
          echo "the account row is pre-event aware"

      - name: nothing in the setup path asks for credentials at install time
        run: |
          # The skill is prose and CI has no model to run it through, so assert the two
          # things about it that are mechanically checkable: it carries the negative
          # constraint with its reason, and it no longer instructs the agent to compose
          # a human-actions list or to pre-run the readiness report.
          S=.agents/skills/bwg-lab-setup/SKILL.md
          for s in "Do not mention gcloud, Qwiklabs accounts, or Antigravity sign-in" \
                   "Use only this skill while you are setting the laptop up." \
                   "Do not write your own list of the things only a human can do." \
                   "Do not run \`--readiness\` yourself."; do
            grep -qF -- "$s" "$S" || { echo "SKILL.md lost its guard: $s"; exit 1; }
          done
          for s in "hand back a short list of the things only a human can do" \
                   "These cannot be automated. List whichever still apply"; do
            grep -qF -- "$s" "$S" && { echo "SKILL.md still generates a hand-off list: $s"; exit 1; }
          done
          echo "the setup skill defers sign-in to the readiness check"

      - name: an interrupted clone is not reported as a healthy kit
        run: |
          # A .git directory with no checkout is what a clone killed by a closed lid
          # leaves behind. The `kit` check used to call that OK, which was a false pass
          # on the one machine that could not run the lab at all.
          rm -rf /tmp/broken && mkdir -p /tmp/broken/.git && echo junk > /tmp/broken/.git/HEAD
          s=$(bash setup/verify.sh --json --track 3 --venv /tmp/fx --kit-dir /tmp/broken \
              | python3 -c 'import json,sys;print([c["status"] for c in json.load(sys.stdin)["checks"] if c["name"]=="kit"][0])')
          [ "$s" = MISSING ] || { echo "kit reported $s on a .git-only directory"; exit 1; }
          echo "a broken clone reports kit=$s"

      - name: an explicit --venv is not overridden by an active virtualenv
        run: |
          # Reporting on a venv the operator did not name is a false pass against the
          # one path they actually asked about.
          # || true: verify.sh correctly exits 3 here, because the named venv does not
          # exist. Exit 3 is the point of the test, so it must not abort the step.
          out=$(VIRTUAL_ENV=/tmp/fx bash setup/verify.sh --json --venv /tmp/nosuchvenv 2>&1 || true)
          case "$out" in
            *nosuchvenv*) echo "an explicit --venv is respected" ;;
            *) echo "--venv was silently overridden: $out"; exit 1 ;;
          esac

      - name: no fix hint tells the user to --force over their own project
        run: |
          # --force moves the Track 3 kit folder aside, and by mid-lab that folder is
          # the attendee's work. Match a recommendation to RUN it, "install.sh ...
          # --force", rather than the bare word: two of these hints now say "Do not
          # --force over your work", which is the guidance and not the bug.
          if grep -nE 'chk (kit|kit-skills|kit-mcp|kit-publish) .*install\.sh[^"]*--force' setup/verify.sh; then
            echo "a Track 3 fix hint still recommends --force"; exit 1; fi
          echo "no starterkit hint recommends --force"

      - name: track 3 dry-run completes and fetches the starter kit
        run: |
          bash setup/install.sh --dry-run --yes --track 3 --root /tmp/ci3 > /tmp/dry3.out 2>&1
          grep -q "Done. Now run" /tmp/dry3.out \
            || { echo "track 3 dry-run did not reach the end"; cat /tmp/dry3.out; exit 1; }
          grep -q "git -C /tmp/ci3/Desktop/build-with-gemini fetch --depth 1 origin" /tmp/dry3.out \
            || { echo "track 3 did not fetch the starter kit"; cat /tmp/dry3.out; exit 1; }
          grep -q "apt-get install -y google-cloud-cli nodejs gh" /tmp/dry3.out \
            || { echo "track 3 did not install gh"; cat /tmp/dry3.out; exit 1; }
          test ! -d /tmp/ci3

      - name: the starter kit is pinned, and the pin is what gets fetched
        run: |
          # An unpinned --depth 1 clone of a community default branch is the whole of
          # M4. Assert that a pin exists, that it is a real object upstream, and that
          # the dry run actually fetches that exact ref rather than a moving branch.
          ref=$(sed -n 's/^KIT_REF="\${KIT_REF:-\(.*\)}"$/\1/p' setup/install.sh)
          [ -n "$ref" ] || { echo "KIT_REF has no default - the kit is unpinned"; exit 1; }
          echo "pinned to $ref"
          grep -q "fetch --depth 1 origin $ref" /tmp/dry3.out \
            || { echo "the dry run does not fetch the pin"; cat /tmp/dry3.out; exit 1; }
          if grep -q "git clone" /tmp/dry3.out; then
            echo "still using git clone, which cannot pin to a commit"; exit 1; fi
          url=$(sed -n 's/^KIT_URL="\${KIT_URL:-\(.*\)}"$/\1/p' setup/install.sh)
          GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code "$url" >/dev/null \
            || { echo "cannot reach $url"; exit 1; }
          rm -rf /tmp/pin && git init -q /tmp/pin && git -C /tmp/pin remote add origin "$url"
          GIT_TERMINAL_PROMPT=0 git -C /tmp/pin fetch --depth 1 origin "$ref" \
            || { echo "the pinned ref $ref no longer exists in $url"; exit 1; }
          git -C /tmp/pin checkout -q --detach FETCH_HEAD
          # The two upstream paths verify.sh asserts must exist at the pin, or a correct
          # machine fails kit-mcp and kit-publish on the day.
          for p in .agents/mcp_config.json .agents/skills/publish-to-github/publish.sh; do
            test -f "/tmp/pin/$p" || { echo "the pin is missing $p, which verify.sh asserts"; exit 1; }
          done
          echo "the pin exists upstream and still has the layout verify.sh expects"

      - name: --kit-url and --kit-dir still work, and --kit-ref can be emptied
        run: |
          bash setup/install.sh --dry-run --yes --track 3 --only starterkit \
            --kit-url https://example.invalid/fork --kit-dir /tmp/elsewhere/kit \
            > /tmp/kitflags.out 2>&1
          grep -q "remote add origin https://example.invalid/fork" /tmp/kitflags.out \
            || { echo "--kit-url was ignored"; cat /tmp/kitflags.out; exit 1; }
          grep -q "git -C /tmp/elsewhere/kit" /tmp/kitflags.out \
            || { echo "--kit-dir was ignored"; cat /tmp/kitflags.out; exit 1; }
          bash setup/install.sh --dry-run --yes --track 3 --only starterkit \
            --kit-ref "" --root /tmp/ci-unpin > /tmp/unpin.out 2>&1
          grep -q "fetch --depth 1 origin HEAD" /tmp/unpin.out \
            || { echo "an empty --kit-ref no longer follows the default branch"; cat /tmp/unpin.out; exit 1; }
          grep -q "kit-ref is empty" /tmp/unpin.out \
            || { echo "an empty --kit-ref should say so out loud"; cat /tmp/unpin.out; exit 1; }
          test ! -d /tmp/elsewhere
          echo "kit flags still work"

      - name: no --track means Track 2, unchanged
        run: |
          # The whole point of the flag is that people who never pass it see no difference.
          # Track 2 owns the sessions step and must not acquire anything belonging to Track 3.
          bash setup/install.sh --dry-run --yes --root /tmp/ci2 > /tmp/dry2.out 2>/dev/null
          grep -q "Step 5/5  Register the skills" /tmp/dry2.out \
            || { echo "default run is no longer the 5-step Track 2 run"; cat /tmp/dry2.out; exit 1; }
          grep -q "Desktop/Session3/.agents/skills" /tmp/dry2.out \
            || { echo "default run stopped creating the session folders"; exit 1; }
          for leak in "build-with-gemini" "nodejs gh" "starter kit"; do
            grep -q -- "$leak" /tmp/dry2.out \
              && { echo "Track 3 content leaked into the default run: $leak"; exit 1; }
          done
          test ! -d /tmp/ci2
          echo "default run is still Track 2"

      - name: a dry run never blocks waiting for a track
        run: |
          # No TTY here, but assert it explicitly: a hang would otherwise show up as a
          # six-hour job rather than a failure.
          timeout 60 bash setup/install.sh --dry-run --root /tmp/ci-tty >/dev/null 2>&1 \
            || { echo "dry-run without --track did not finish"; exit 1; }
          timeout 60 bash setup/preflight.sh --track 3 >/dev/null 2>&1 || [ $? -le 2 ]

      - name: pinned set matches what verify expects
        run: |
          lock=$(grep -c '==' setup/requirements-lock.txt)
          want=$(sed -n 's/.*chk packages *"\([0-9]*\)".*/\1/p' setup/verify.sh)
          [ "$lock" = "$want" ] \
            || { echo "lockfile has $lock packages but verify.sh expects $want"; exit 1; }
          echo "lockfile and verify agree: $lock packages"

      - name: no third-party model vendor SDKs
        run: |
          if grep -qiE '^(litellm|openai|anthropic|tiktoken|tokenizers|cdp)==' setup/requirements-lock.txt; then
            echo "a vendor SDK is back in the lockfile"; exit 1; fi

      - name: skills are published path-portable
        run: |
          if grep -rqE '(^|[[:space:]`"(])/config([^a-zA-Z]|$)' skills; then
            echo "skills still contain the VM home path"; exit 1; fi

      - name: no substring corruption from the path rewrite
        run: |
          if grep -rqE '[a-zA-Z]\$HOME' skills --include=*.md; then
            echo "path rewrite corrupted a word"; exit 1; fi

      - name: docs and scripts agree
        run: |
          for term in "only agy" "step_agy" "Step ./6"; do
            if grep -rqE "$term" README.md manual_setup.md TROUBLESHOOTING.md setup/ 2>/dev/null; then
              echo "stale reference to '$term'"; exit 1; fi
          done

      - name: every exit code a script can return is in the troubleshooting table
        run: |
          # Exit 66 shipped undocumented: the behaviour was correct, CI asserted it,
          # and no README, skill or table mentioned the number anywhere. An attendee
          # or an assistant reading 66 had nothing to look it up in. This closes that
          # by construction rather than by remembering: add an `exit N` to any setup
          # script and this step fails until the table has a column for N.
          #
          # Literals only. preflight.sh and verify.sh also `exit "$CODE"` from a
          # variable, and those codes are the ones the header comments enumerate;
          # chasing variables is not worth a false failure. setup/lab-phase.sh is
          # sourced and never run on its own, so its exit 64 is returned by whichever
          # script sourced it, and both of those have a 64 column already.
          hdr="$(grep -n '^| Script |' TROUBLESHOOTING.md | head -1)"
          [ -n "$hdr" ] || { echo "the exit-code table has gone from TROUBLESHOOTING.md"; exit 1; }
          echo "table header: $hdr"
          bad=0
          for f in setup/*.sh; do
            for n in $(grep -oE '\bexit [0-9]+' "$f" | awk '{print $2}' | sort -un); do
              echo "$hdr" | grep -qE "\| $n \|" \
                || { echo "$f can exit $n and the table has no column for it"; bad=1; }
            done
          done
          # And one row per script a person actually runs.
          for s in install.sh preflight.sh verify.sh; do
            grep -q "^| \`$s\` |" TROUBLESHOOTING.md \
              || { echo "no exit-code row for $s"; bad=1; }
          done
          # The header comment in each runnable script must enumerate them too, which
          # is the copy a reader hits first. install.sh had no such line at all.
          for s in install.sh preflight.sh verify.sh; do
            grep -q '^# Exit:' "setup/$s" \
              || { echo "setup/$s has no '# Exit:' header line"; bad=1; }
          done
          # 66 specifically, since it is the newest and the one that shipped silent.
          for f in TROUBLESHOOTING.md README.md .agents/skills/bwg-lab-setup/SKILL.md; do
            grep -q '66' "$f" || { echo "$f does not mention exit 66"; bad=1; }
          done
          [ "$bad" = 0 ] || exit 1
          echo "every exit literal in setup/*.sh is documented"

      - name: markdown links resolve
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = [f"{f} -> {m}"
                 for f in glob.glob("*.md") + glob.glob(".agents/skills/*/*.md")
                 for m in re.findall(r'\]\(([^)#]+\.md)(?:#[^)]*)?\)', open(f).read())
                 if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), m)))]
          print("broken links:", bad or "none")
          sys.exit(1 if bad else 0)
          PY

      - name: every flag the docs mention actually exists
        run: |
          # The README once advertised a Track 3 the code did not have. Assert the docs
          # against the real argument parsers rather than against a hand-written list of
          # stale strings, which only ever catches the last bug and never the next one.
          python3 - <<'PY'
          import re, sys
          accepted = {}
          for s in ("install", "verify", "preflight"):
              src = open(f"setup/{s}.sh").read()
              # \bdone\b, not ^done: preflight.sh writes its whole parser on one line
              # and ends it with "esac; shift; done".
              m = re.search(r'while \[ \$# -gt 0 \];.*?\bdone\b', src, re.S)
              if not m:
                  print(f"setup/{s}.sh has no recognisable argument parser")
                  sys.exit(1)
              accepted[s] = set(re.findall(r'(--[a-z-]+)[)|]', m.group(0)))
          bad = []
          for d in ("README.md", "manual_setup.md", "TROUBLESHOOTING.md",
                    ".agents/skills/bwg-lab-setup/SKILL.md"):
              for i, line in enumerate(open(d), 1):
                  for s in accepted:
                      for hit in re.finditer(
                              rf'{s}\.sh((?:\s+--[a-z-]+(?:\s+[^\s#`|)]+)?)*)', line):
                          for f in re.findall(r'(--[a-z-]+)', hit.group(1)):
                              if f not in accepted[s]:
                                  bad.append(f"{d}:{i}  {s}.sh has no {f}")
          print("\n".join(bad) or "every documented flag exists")
          sys.exit(1 if bad else 0)
          PY

  macos:
    # The brew branch of step_tools is half the supported platforms, and until now no
    # job anywhere touched it. That is the direct reason Track 3 shipped without a gh
    # install on macOS: the code was written by analogy with the Linux path, nobody on
    # the project has a Mac, and nothing could contradict it. A dry run on a real macOS
    # runner turns that from an unverifiable claim into a gated one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax
        run: for f in setup/*.sh; do bash -n "$f"; done

      - name: shellcheck
        # `|| brew list`: brew exits non-zero on some images when the formula is
        # already present, which is not a reason to fail the build.
        run: (brew install shellcheck || brew list shellcheck) && shellcheck -S warning setup/*.sh

      - name: hide the preinstalled gh
        run: |
          # This image ships gh. An attendee's laptop does not. Left as it is, `need gh`
          # would be true, the brew branch would correctly print nothing, and the
          # assertion below would pass while proving nothing at all. Rename the binary
          # for the rest of this ephemeral job so the dry run sees the machine the lab
          # actually has to cope with.
          for _ in 1 2 3; do
            p="$(command -v gh || true)"
            [ -n "$p" ] || break
            sudo mv "$p" "$p.hidden-for-ci"
          done
          if command -v gh >/dev/null 2>&1; then
            echo "gh is still on PATH, the rest of this job would prove nothing"; exit 1; fi
          echo "gh is hidden"

      - name: track 3 on macOS installs gh
        run: |
          bash setup/install.sh --dry-run --yes --track 3 \
            --root "$RUNNER_TEMP/m3" > "$RUNNER_TEMP/m3.out" 2>&1
          cat "$RUNNER_TEMP/m3.out"
          grep -q "Done. Now run" "$RUNNER_TEMP/m3.out" \
            || { echo "macOS Track 3 dry-run did not reach the end"; exit 1; }
          grep -q "brew install gh" "$RUNNER_TEMP/m3.out" \
            || { echo "macOS Track 3 still does not install gh"; exit 1; }
          grep -q "fetch --depth 1 origin" "$RUNNER_TEMP/m3.out" \
            || { echo "macOS Track 3 does not fetch the starter kit"; exit 1; }
          test ! -d "$RUNNER_TEMP/m3"

      - name: track 2 on macOS does not install gh
        run: |
          bash setup/install.sh --dry-run --yes --track 2 \
            --root "$RUNNER_TEMP/m2" > "$RUNNER_TEMP/m2.out" 2>&1
          if grep -q "brew install gh" "$RUNNER_TEMP/m2.out"; then
            echo "Track 3 content leaked into Track 2 on macOS"; exit 1; fi
          grep -q "Step 5/5  Register the skills" "$RUNNER_TEMP/m2.out" \
            || { echo "macOS Track 2 is no longer the 5-step run"; cat "$RUNNER_TEMP/m2.out"; exit 1; }
          test ! -d "$RUNNER_TEMP/m2"

      - name: the macOS log timestamp is not a GNU-only date
        run: |
          # date -Is is GNU only. On BSD date every logged line got an empty timestamp
          # and a "date: illegal option -- I" on stderr, on the one platform that was
          # already failing hardest.
          # Strip comments before grepping. The comment in install.sh's run() explains
          # why `date -Is` was removed and therefore contains the string, so this
          # assertion used to fail on its own documentation. That is the whole reason
          # this job has never once passed, and why the brew branch it exists to cover
          # has been effectively unguarded since it was added.
          code() { sed 's/[[:space:]]*#.*$//' "$1"; }
          if code setup/install.sh | grep -q 'date -Is'; then
            echo "date -Is is back, and BSD date has no -I"; exit 1; fi
          # Positive control. Stripping comments must not have turned this into a
          # check that can never fire, so prove it still catches the real thing.
          printf 'x=$(date -Is)\n' > "$RUNNER_TEMP/positive-control.sh"
          if ! code "$RUNNER_TEMP/positive-control.sh" | grep -q 'date -Is'; then
            echo "the comment-stripping assertion can no longer detect date -Is"; exit 1; fi
          date -u +%Y-%m-%dT%H:%M:%SZ >/dev/null \
            || { echo "the replacement timestamp does not work on BSD date"; exit 1; }
          echo "timestamp format is portable: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
