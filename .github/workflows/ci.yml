name: ci
on: [push, pull_request]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax
        run: for f in setup/*.sh; do bash -n "$f"; done

      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck -S warning setup/*.sh || true

      - name: preflight runs and reports
        run: bash setup/preflight.sh || [ $? -le 2 ]

      - name: preflight is track-neutral
        run: |
          # --track must record the track and change nothing that is measured. If a
          # check ever becomes track-dependent, these counts stop matching.
          python3 - <<'PY'
          import json, subprocess, sys
          def run(args):
              p = subprocess.run(["bash", "setup/preflight.sh", "--json"] + args,
                                 capture_output=True, text=True)
              return json.loads(p.stdout)
          base = run([])
          for t in ("2", "3"):
              got = run(["--track", t])
              assert got["track"] == t, got["track"]
              for k in ("verdict", "exit", "ok", "warn", "fail"):
                  assert got[k] == base[k], (k, got[k], base[k])
              assert len(got["checks"]) == len(base["checks"])
          assert base["track"] == "not given"
          print("preflight is track-neutral:", base["verdict"], base["ok"], "ok")
          PY

      - name: install dry-run completes
        run: |
          bash setup/install.sh --dry-run --yes --root /tmp/ci > /tmp/dry.out 2>&1
          # Assert the terminal marker, not a step number. This used to grep "Step 6/6"
          # and broke the moment a step was removed, even though the dry-run succeeded.
          grep -q "Done. Now run" /tmp/dry.out \
            || { echo "dry-run did not reach the end"; cat /tmp/dry.out; exit 1; }

      - name: dry-run must not create anything
        run: test ! -d /tmp/ci

      - name: every declared step is runnable
        run: |
          steps=$(sed -n 's/^ALL_STEPS=(\(.*\))/\1/p' setup/install.sh)
          [ -n "$steps" ] || { echo "could not read ALL_STEPS"; exit 1; }
          for s in $steps; do
            grep -q "^step_$s()" setup/install.sh \
              || { echo "declared step '$s' has no step_$s function"; exit 1; }
            bash setup/install.sh --dry-run --yes --only "$s" --root /tmp/ci-only >/dev/null 2>&1 \
              || { echo "--only $s failed"; exit 1; }
          done
          for f in $(grep -oE '^step_[a-z]+' setup/install.sh | sed 's/step_//'); do
            echo "$steps" | grep -qw "$f" \
              || { echo "step_$f exists but is not in ALL_STEPS"; exit 1; }
          done
          echo "steps ok: $steps"

      - name: verify has not lost its checks
        run: |
          # ' *chk ', not '^chk ': the track-specific checks live inside an if block and
          # are indented. Counting only column-zero calls would silently ignore them.
          n=$(grep -cE '^ *chk ' setup/verify.sh)
          [ "$n" -ge 15 ] || { echo "verify.sh has only $n checks - did some get deleted?"; exit 1; }
          echo "verify.sh has $n checks"

      - name: both track profiles are present and Track 2 kept every check it had
        run: |
          for c in packages sessions lab-skill config-paths; do
            grep -qE "^ *chk $c " setup/verify.sh \
              || { echo "Track 2 check '$c' was deleted"; exit 1; }
          done
          for c in kit kit-skills kit-mcp kit-publish gh; do
            grep -qE "^ *chk $c " setup/verify.sh \
              || { echo "Track 3 check '$c' is missing"; exit 1; }
          done
          echo "both profiles present"

      - name: track 3 dry-run completes and fetches the starter kit
        run: |
          bash setup/install.sh --dry-run --yes --track 3 --root /tmp/ci3 > /tmp/dry3.out 2>&1
          grep -q "Done. Now run" /tmp/dry3.out \
            || { echo "track 3 dry-run did not reach the end"; cat /tmp/dry3.out; exit 1; }
          grep -q "git clone .* /tmp/ci3/Desktop/build-with-gemini" /tmp/dry3.out \
            || { echo "track 3 did not clone the starter kit"; cat /tmp/dry3.out; exit 1; }
          grep -q "apt-get install -y google-cloud-cli nodejs gh" /tmp/dry3.out \
            || { echo "track 3 did not install gh"; cat /tmp/dry3.out; exit 1; }
          test ! -d /tmp/ci3

      - name: no --track means Track 2, unchanged
        run: |
          # The whole point of the flag is that people who never pass it see no difference.
          # Track 2 owns the sessions step and must not acquire anything belonging to Track 3.
          bash setup/install.sh --dry-run --yes --root /tmp/ci2 > /tmp/dry2.out 2>/dev/null
          grep -q "Step 5/5  Register the skills" /tmp/dry2.out \
            || { echo "default run is no longer the 5-step Track 2 run"; cat /tmp/dry2.out; exit 1; }
          grep -q "Desktop/Session3/.agents/skills" /tmp/dry2.out \
            || { echo "default run stopped creating the session folders"; exit 1; }
          for leak in "build-with-gemini" "nodejs gh" "starter kit"; do
            grep -q "$leak" /tmp/dry2.out \
              && { echo "Track 3 content leaked into the default run: $leak"; exit 1; }
          done
          test ! -d /tmp/ci2
          echo "default run is still Track 2"

      - name: a dry run never blocks waiting for a track
        run: |
          # No TTY here, but assert it explicitly: a hang would otherwise show up as a
          # six-hour job rather than a failure.
          timeout 60 bash setup/install.sh --dry-run --root /tmp/ci-tty >/dev/null 2>&1 \
            || { echo "dry-run without --track did not finish"; exit 1; }
          timeout 60 bash setup/preflight.sh --track 3 >/dev/null 2>&1 || [ $? -le 2 ]

      - name: pinned set matches what verify expects
        run: |
          lock=$(grep -c '==' setup/requirements-lock.txt)
          want=$(sed -n 's/.*chk packages *"\([0-9]*\)".*/\1/p' setup/verify.sh)
          [ "$lock" = "$want" ] \
            || { echo "lockfile has $lock packages but verify.sh expects $want"; exit 1; }
          echo "lockfile and verify agree: $lock packages"

      - name: no third-party model vendor SDKs
        run: |
          if grep -qiE '^(litellm|openai|anthropic|tiktoken|tokenizers|cdp)==' setup/requirements-lock.txt; then
            echo "a vendor SDK is back in the lockfile"; exit 1; fi

      - name: skills are published path-portable
        run: |
          if grep -rqE '(^|[[:space:]`"(])/config([^a-zA-Z]|$)' skills; then
            echo "skills still contain the VM home path"; exit 1; fi

      - name: no substring corruption from the path rewrite
        run: |
          if grep -rqE '[a-zA-Z]\$HOME' skills --include=*.md; then
            echo "path rewrite corrupted a word"; exit 1; fi

      - name: docs and scripts agree
        run: |
          for term in "only agy" "step_agy" "Step ./6"; do
            if grep -rqE "$term" README.md manual_setup.md TROUBLESHOOTING.md setup/ 2>/dev/null; then
              echo "stale reference to '$term'"; exit 1; fi
          done

      - name: markdown links resolve
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = [f"{f} -> {m}"
                 for f in glob.glob("*.md") + glob.glob(".agents/skills/*/*.md")
                 for m in re.findall(r'\]\(([^)#]+\.md)(?:#[^)]*)?\)', open(f).read())
                 if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), m)))]
          print("broken links:", bad or "none")
          sys.exit(1 if bad else 0)
          PY
